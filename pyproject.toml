[project]
name = "reflex-react-github-calendar"
version = "0.2.0"
description = "A Reflex custom component wrapping react-github-calendar v5 (a GitHub contributions heatmap with themes, sizing, labels and localization)."
readme = "README.md"
# Reflex 0.10 requires Python >= 3.11.
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
# "reflex-custom-components" is required for Reflex gallery / PyPI discovery.
keywords = ["reflex", "reflex-component", "reflex-custom-components", "react-github-calendar", "github", "calendar", "heatmap", "contributions", "component"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["reflex>=0.10.0"]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-react-github-calendar"
Repository = "https://github.com/ecrespo/reflex-react-github-calendar"
Issues = "https://github.com/ecrespo/reflex-react-github-calendar/issues"
Changelog = "https://github.com/ecrespo/reflex-react-github-calendar/blob/main/CHANGELOG.md"
"react-github-calendar" = "https://github.com/grubersjoe/react-github-calendar"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
# `reflex component build` was removed in Reflex 0.10; the hatch-reflex-pyi hook
# now generates the .pyi stubs at build time (requires the src/ layout).
requires = ["hatchling", "hatch-reflex-pyi"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The .pyi stubs are generated at build time and are not committed.
artifacts = ["/src/**/*.pyi"]

[tool.hatch.build.targets.sdist]
exclude = ["/reflex_react_github_calendar_demo", "/.github", "/.claude", "/.playwright-cli", "/docs"]

[tool.hatch.build.hooks.reflex-pyi]
dependencies = ["ruff", "reflex>=0.10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
